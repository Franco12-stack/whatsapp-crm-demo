# Render Blueprint — one-click deploy. See README.md for the "Deploy to
# Render" link. Free tier: the database expires after 30 days and web
# services spin down after 15 minutes idle (first request after that takes
# about a minute to wake up) — fine for a demo, not for anything real.
#
# No manual seed step needed: the backend seeds itself on first boot
# (see app/main.py's lifespan + scripts/seed_demo.py's seed_if_empty()).

databases:
  - name: whatsapp-crm-demo-db
    plan: free
    databaseName: demo
    user: demo

services:
  - type: web
    name: whatsapp-crm-demo-backend
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: whatsapp-crm-demo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SIMULATE_CUSTOMER_REPLIES
        value: "true"
      - key: AUTO_SEED
        value: "true"

  - type: web
    name: whatsapp-crm-demo-frontend
    runtime: docker
    plan: free
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    envVars:
      # Baked into the Vite build at image-build time, so it has to be a
      # fixed value, not a live cross-service reference. Render names a
      # service's default subdomain after it: https://<name>.onrender.com.
      # If whatsapp-crm-demo-backend is taken, Render appends a suffix to
      # make it unique — check the backend service's actual URL in the
      # Render dashboard after the first deploy and update this if it
      # doesn't match, then trigger a manual redeploy of the frontend.
      - key: VITE_API_BASE_URL
        value: https://whatsapp-crm-demo-backend.onrender.com
